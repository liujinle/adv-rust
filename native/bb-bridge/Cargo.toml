[package]
name = "bb-bridge"
description = "Stable C ABI and JNI surface of the BlackBox native core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bb_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni"]
# JNI bindings are hand written (no `jni` crate) so the .so has zero extra
# dependencies and can be built offline. Disable for pure C ABI consumers.
jni = []

[dependencies]
bb-common = { workspace = true }
bb-config = { workspace = true }
bb-storage = { workspace = true }
bb-vfs = { workspace = true }
bb-ipc = { workspace = true }
bb-runtime = { workspace = true }
bb-scheduler = { workspace = true }
bb-apk = { workspace = true }
bb-resource = { workspace = true }
bb-monitor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests synthesise APKs instead of committing binary fixtures.
bb-apk = { workspace = true, features = ["fixtures"] }
