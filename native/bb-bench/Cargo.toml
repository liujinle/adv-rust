[package]
name = "bb-bench"
description = "Latency harness for the native core modules (median / p95, JSON output)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bb-bench"
path = "src/main.rs"

[dependencies]
bb-common = { workspace = true }
bb-config = { workspace = true }
bb-storage = { workspace = true }
bb-vfs = { workspace = true }
bb-ipc = { workspace = true }
bb-runtime = { workspace = true }
bb-scheduler = { workspace = true }
bb-apk = { workspace = true, features = ["fixtures"] }
bb-resource = { workspace = true }
bb-monitor = { workspace = true }
bb-bridge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
